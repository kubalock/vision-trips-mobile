<main class="min-h-dvh bg-stone-50 text-slate-900">
  <section class="mx-auto flex min-h-dvh max-w-lg flex-col px-6 py-10 sm:justify-center">
    <div class="mb-10 flex items-center gap-3">
      <span class="grid size-11 place-items-center rounded-2xl bg-teal-700 text-xl font-bold text-white">V</span>
      <div>
        <p class="text-lg font-semibold">Vision Trips</p>
        <p class="text-sm text-slate-500">Every part of your trip, in one place.</p>
      </div>
    </div>

    <div class="rounded-[2rem] bg-white p-7 shadow-xl shadow-slate-900/5 ring-1 ring-slate-200">
      <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-teal-700">Open your trip</p>
      <h1 class="text-3xl font-semibold tracking-tight">Where are you heading?</h1>
      <p class="mt-3 text-base leading-7 text-slate-600">
        Paste the itinerary link from your travel agent or enter your trip code.
      </p>

      <form class="mt-7" (submit)="openTrip($event)">
        <label for="trip-code" class="text-sm font-semibold">Itinerary link or code</label>
        <input
          id="trip-code"
          name="trip-code"
          type="text"
          autocomplete="off"
          [value]="linkOrCode()"
          (input)="updateLink($event)"
          placeholder="Paste link or enter code"
          class="mt-2 w-full rounded-2xl border border-slate-300 bg-white px-4 py-4 text-base outline-none transition focus:border-teal-700 focus:ring-4 focus:ring-teal-700/10"
        />
        <button
          type="submit"
          [disabled]="!canContinue()"
          class="mt-4 w-full rounded-full bg-teal-700 px-5 py-4 font-semibold text-white transition enabled:hover:bg-teal-800 disabled:cursor-not-allowed disabled:opacity-40"
        >
          Continue securely
        </button>
      </form>

      <p class="mt-5 text-center text-xs leading-5 text-slate-500">
        Your booking details are verified before they are saved to this device.
      </p>
    </div>

    <p class="mt-8 text-center text-sm text-slate-500">Saved trips will appear here after verification.</p>
  </section>
</main>
